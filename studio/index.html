<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Film Studio Monitor</title>
<style>
  :root { --bg:#f6f7f7; --panel:#fff; --ink:#182027; --muted:#66727b; --rule:#dce1e4; --accent:#1f5a94; --ok:#1d7a46; --run:#b86a00; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 "DM Sans", system-ui, sans-serif; }
  header { display:flex; align-items:baseline; gap:12px; padding:14px 20px; border-bottom:2px solid var(--rule); background:var(--panel); position:sticky; top:0; z-index:2; }
  header h1 { margin:0; font-size:17px; } header .now { color:var(--muted); font-size:13px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .live { width:8px; height:8px; border-radius:50%; background:var(--run); align-self:center; animation:pulse 1.2s infinite alternate; }
  @keyframes pulse { to { opacity:.25; } }
  .eta { font: 600 14px "IBM Plex Mono", ui-monospace, monospace; color: var(--accent); white-space: nowrap; }
  .progress { position: sticky; top: 52px; z-index: 2; height: 26px; margin: 0; background: var(--rule); }
  .progress .bar { height: 100%; width: 0; background: linear-gradient(90deg, #1f5a94, #5aa9ff); transition: width .8s cubic-bezier(.2,.7,.2,1); }
  .progress .pct { position: absolute; left: 14px; top: 4px; font: 600 12px "IBM Plex Mono", ui-monospace, monospace; color: #fff; mix-blend-mode: difference; }
  main { display:grid; grid-template-columns: 300px minmax(0,1fr); gap:16px; padding:16px 20px 40px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background:var(--panel); border:1px solid var(--rule); border-radius:8px; padding:14px 16px; margin-bottom:16px; }
  h2 { margin:0 0 10px; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  ol.steps { list-style:none; margin:0; padding:0; }
  ol.steps li { display:flex; gap:9px; padding:6px 0; border-bottom:1px solid var(--rule); font-size:13px; }
  ol.steps li:last-child { border:0; }
  .dot { flex:none; width:16px; height:16px; border-radius:50%; border:2px solid var(--rule); margin-top:1px; }
  li[data-s=done] .dot { background:var(--ok); border-color:var(--ok); }
  li[data-s=run] .dot { border-color:var(--run); border-top-color:transparent; animation:spin .9s linear infinite; }
  li[data-s=done] { color:var(--muted); }
  @keyframes spin { to { transform:rotate(360deg); } }
  .log { font:12px/1.5 "IBM Plex Mono", ui-monospace, monospace; color:var(--muted); max-height:260px; overflow:auto; }
  .log div { padding:2px 0; } .log b { color:var(--ink); font-weight:500; }
  .player { position:relative; aspect-ratio:16/9; background:#111; border-radius:6px; overflow:hidden; }
  .player iframe, .player video { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .placeholder { position:absolute; inset:0; display:grid; place-items:center; color:#8a959c; font-size:13px; }
  .gallery { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:10px; }
  .gallery figure { margin:0; } .gallery img { width:100%; border:1px solid var(--rule); border-radius:4px; display:block; background:#eee; }
  .gallery figcaption { font-size:12px; color:var(--muted); margin-top:4px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--rule); vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  .ok { color:var(--ok); font-weight:600; } .bad { color:#b3261e; font-weight:600; }
  audio { height:28px; width:170px; }
  .scores { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; }
  .score { border:1px solid var(--rule); border-radius:6px; padding:10px; }
  .score .n { font-size:30px; font-weight:700; } .score .who { color:var(--muted); font-size:12px; }
  .tabs { display:flex; gap:6px; margin-bottom:8px; } .tabs button { font:inherit; font-size:12px; padding:4px 10px; border:1px solid var(--rule); border-radius:4px; background:var(--panel); cursor:pointer; }
  .tabs button[aria-pressed=true] { background:var(--ink); color:#fff; border-color:var(--ink); }
</style>
</head>
<body>
<header><span class="live" id="live"></span><h1>Film Studio Monitor</h1><span class="now" id="now">connecting…</span><span class="eta" id="eta"></span></header>
<div class="progress"><div class="bar" id="bar"></div><span class="pct" id="pct"></span></div>
<main>
  <div>
    <section><h2>Steps</h2><ol class="steps" id="steps"></ol></section>
    <section><h2>Log</h2><div class="log" id="log"></div></section>
  </div>
  <div>
    <section>
      <h2>Film</h2>
      <div class="tabs"><button id="tab-live" aria-pressed="true">Live build</button><button id="tab-cut" aria-pressed="false">Exported cut</button></div>
      <div class="player" id="player"><div class="placeholder">the film appears here once the first shots are drawn</div></div>
    </section>
    <section id="judges-sec" hidden><h2>Judges</h2><div class="scores" id="judges"></div></section>
    <section><h2>Latest frames</h2><div class="gallery" id="gallery"></div></section>
    <section><h2>Voice lines</h2><table><thead><tr><th>Line</th><th>Who</th><th>Text</th><th>Length</th><th>Check</th><th></th></tr></thead><tbody id="voice"></tbody></table></section>
  </div>
</main>
<script>
let mode = 'live', lastFilm = '', lastCut = '';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
$('tab-live').onclick = () => { mode = 'live'; lastFilm = lastCut = ''; sync(); };
$('tab-cut').onclick = () => { mode = 'cut'; lastFilm = lastCut = ''; sync(); };
let state = {};
function renderPlayer() {
  $('tab-live').setAttribute('aria-pressed', mode === 'live'); $('tab-cut').setAttribute('aria-pressed', mode === 'cut');
  const p = $('player');
  if (mode === 'live' && state.film) {
    if (lastFilm !== state.filmVersion) { lastFilm = state.filmVersion; p.innerHTML = `<iframe src="/${esc(state.film)}?v=${esc(state.filmVersion)}" title="live film"></iframe>`; }
  } else if (mode === 'cut' && state.cut) {
    if (lastCut !== state.cut) { lastCut = state.cut; p.innerHTML = `<video src="/${esc(state.cut)}" controls></video>`; }
  } else if (!p.querySelector('.placeholder')) {
    lastFilm = lastCut = ''; p.innerHTML = `<div class="placeholder">${mode === 'cut' ? 'no exported cut yet' : 'the film appears here once the first shots are drawn'}</div>`;
  }
}
async function sync() {
  try {
    state = await (await fetch('/studio/progress.json', { cache: 'no-store' })).json();
  } catch { $('now').textContent = 'waiting for progress…'; return; }
  $('now').textContent = state.now || '';
  const steps = state.steps || [], done = steps.filter((s) => s.s === 'done').length, run = steps.some((s) => s.s === 'run') ? 0.5 : 0;
  const pct = state.done ? 100 : (state.pct ?? Math.round(((done + run) / Math.max(1, steps.length)) * 100));
  $('bar').style.width = pct + '%'; $('pct').textContent = pct + ' % done';
  if (state.done) $('eta').textContent = 'ready';
  else if (state.etaAt) { const m = Math.max(0, (state.etaAt - Date.now()) / 60000); const at = new Date(state.etaAt).toTimeString().slice(0, 5); $('eta').textContent = m < 0.5 ? 'any moment' : 'ETA ' + at + ' · ~' + Math.ceil(m) + ' min left'; }
  $('live').style.background = state.done ? 'var(--ok)' : 'var(--run)';
  $('steps').innerHTML = (state.steps || []).map((s) => `<li data-s="${esc(s.s)}"><span class="dot"></span><span>${esc(s.t)}</span></li>`).join('');
  $('log').innerHTML = (state.log || []).slice().reverse().map((l) => `<div><b>${esc(l.at)}</b> ${esc(l.msg)}</div>`).join('');
  $('gallery').innerHTML = (state.images || []).map((im) => `<figure><a href="/${esc(im.src)}" target="_blank"><img loading="lazy" src="/${esc(im.src)}?v=${esc(im.v || '')}" alt=""></a><figcaption>${esc(im.cap)}</figcaption></figure>`).join('');
  $('voice').innerHTML = (state.voice || []).map((v) => `<tr><td>${esc(v.id)}</td><td>${esc(v.who)}</td><td>${esc(v.text)}</td><td>${v.dur ? v.dur.toFixed(2) + ' s' : '…'}</td><td class="${v.ok === true ? 'ok' : v.ok === false ? 'bad' : ''}">${v.ok === true ? 'heard ✓' : v.ok === false ? 'mismatch' : ''}</td><td>${v.src ? `<audio controls preload="none" src="/${esc(v.src)}?v=${esc(v.v || '')}"></audio>` : ''}</td></tr>`).join('');
  const j = state.judges || [];
  $('judges-sec').hidden = !j.length;
  $('judges').innerHTML = j.map((x) => `<div class="score"><div class="who">${esc(x.who)}</div><div class="n">${esc(x.score)}</div><div>${esc(x.note)}</div></div>`).join('');
  renderPlayer();
}
sync(); setInterval(sync, 2500);
</script>
</body>
</html>
